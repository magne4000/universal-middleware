autoInstallPeers: false
linkWorkspacePackages: deep
packages:
  - packages/*
  - examples/*
  - tests-examples/*
  - docs
catalog:
  '@cloudflare/workers-types': ^5.20261023.1
  '@hattip/adapter-node': ^0.0.49
  '@hattip/core': ^0.0.49
  '@hattip/router': ^0.0.49
  '@hono/node-server': ^2.1.5
  '@swc/core': ^1.16.20
  '@types/bun': ^1.4.4
  '@types/express': ^5.0.6
  '@types/node': ^22.18.0
  '@webroute/route': ^0.8.0
  elysia: ^1.4.30
  express: ^5.3.0
  fastify: ^5.12.7
  fastify-raw-body: ^6.0.3
  h3: ^2.0.8
  hono: ^4.13.13
  mri: ^1.2.0
  srvx: ^1.0.6
  tsdown: ^0.23.2
  tsx: ^4.23.15
  # rolldown-plugin-dts emits types through the TypeScript 7.1 API. Exact: the 7.1.0-dev nightlies sort above 7.1.0-beta
  typescript: 7.1.0-beta
  vercel: ^62.7.0
  vite: ^8.3.5
  vitest: ^5.0.5
  wrangler: ^4.152.0
