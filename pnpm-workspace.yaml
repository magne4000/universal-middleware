autoInstallPeers: false
linkWorkspacePackages: deep
packages:
  - packages/*
  - examples/*
  - tests-examples/*
  - docs
catalog:
  '@cloudflare/workers-types': ^5.20261106.1
  '@hattip/adapter-node': ^0.0.49
  '@hattip/core': ^0.0.49
  '@hattip/router': ^0.0.49
  '@hono/node-server': ^2.1.6
  '@swc/core': ^1.16.22
  '@types/bun': ^1.4.4
  '@types/express': ^5.0.6
  '@types/node': ^22.18.0
  '@webroute/route': ^0.8.0
  elysia: ^1.4.31
  express: ^5.3.0
  fastify: ^5.12.8
  fastify-raw-body: ^6.0.3
  h3: ^2.0.8
  hono: ^4.13.16
  mri: ^1.2.0
  srvx: ^1.0.8
  tsdown: ^0.23.5
  tsx: ^4.23.15
  # rolldown-plugin-dts emits types through the TypeScript 7.1 API. Exact: the 7.1.0-dev nightlies sort above 7.1.0-beta
  typescript: 7.1.0-beta
  vercel: ^65.12.1
  vite: ^8.3.6
  vitest: ^5.1.0
  wrangler: ^4.158.0
catalogs:
  docs:
    # twoslash type-checks the docs' code samples through TypeScript's JS API, which TypeScript 7 does not ship
    typescript: ^6.0.3
overrides:
  "@vercel/node>typescript": "catalog:"
  "@webroute/middleware": "^0.10.0"
  "esbuild": "^0.28.2"
allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true
  koffi: false
  playwright-chromium: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - tsdown@0.23.5
