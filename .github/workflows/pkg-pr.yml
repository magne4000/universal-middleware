name: Publish Any Commit
on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'pkg-pr-new')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # `--pnpm` packs with pnpm, which resolves the `catalog:` and `workspace:` versions in the manifests
      - run: pnpm dlx pkg-pr-new@0.0.91 publish --pnpm './packages/*'
